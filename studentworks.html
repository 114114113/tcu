<style>
    /* 讓卡片有可點擊的手指游標與微幅互動感 */
    main > div:first-child > div {
        cursor: pointer;
    }

    /* Lightbox 燈箱黑底遮罩 */
    .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: rgba(0, 0, 0, 0.88);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .lightbox.active {
        display: flex;
    }

    .lightbox-container {
        max-width: 90%;
        max-height: 85vh;
        text-align: center;
    }

    .lightbox-container img {
        max-width: 100%;
        max-height: 75vh;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        object-fit: contain;
    }

    .lightbox-info {
        color: #ffffff;
        margin-top: 15px;
    }

    .lightbox-info h4 {
        font-size: 1.25rem;
        margin-bottom: 5px;
    }

    .lightbox-info p {
        font-size: 0.95rem;
        color: #ced4da;
    }

    .lb-close {
        position: fixed;
        top: 20px;
        right: 30px;
        color: #ffffff;
        font-size: 2.5rem;
        cursor: pointer;
        line-height: 1;
        z-index: 10000;
    }

    .lb-nav {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border: none;
        font-size: 1.8rem;
        padding: 12px 18px;
        cursor: pointer;
        border-radius: 8px;
        z-index: 10000;
    }

    .lb-nav:hover {
        background: rgba(255, 255, 255, 0.35);
    }

    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
</style>

<div id="lightbox" class="lightbox" onclick="closeOnBg(event)">
    <span class="lb-close" onclick="closeLightbox()">&times;</span>
    <button class="lb-nav lb-prev" onclick="changeSlide(-1)" aria-label="上一張">&#10094;</button>
    
    <div class="lightbox-container">
        <img id="lb-img" src="" alt="作品大圖">
        <div class="lightbox-info">
            <h4 id="lb-title"></h4>
            <p id="lb-desc"></p>
        </div>
    </div>

    <button class="lb-nav lb-next" onclick="changeSlide(1)" aria-label="下一張">&#10095;</button>
</div>

<script>
    const cardContainers = document.querySelectorAll('main > div:first-child > div');
    const galleryItems = Array.from(cardContainers).map((card, index) => {
        card.addEventListener('click', () => openLightbox(index));
        return {
            src: card.querySelector('img') ? card.querySelector('img').getAttribute('src') : '',
            title: card.querySelector('h3') ? card.querySelector('h3').textContent : '',
            desc: card.querySelector('p') ? card.querySelector('p').textContent : ''
        };
    });

    let currentIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbTitle = document.getElementById('lb-title');
    const lbDesc = document.getElementById('lb-desc');

    function openLightbox(index) {
        currentIndex = index;
        updateLightbox();
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    function closeOnBg(event) {
        if (event.target === lightbox) {
            closeLightbox();
        }
    }

    function changeSlide(step) {
        currentIndex = (currentIndex + step + galleryItems.length) % galleryItems.length;
        updateLightbox();
    }

    function updateLightbox() {
        const item = galleryItems[currentIndex];
        lbImg.src = item.src;
        lbTitle.textContent = item.title;
        lbDesc.textContent = item.desc;
    }

    document.addEventListener('keydown', (e) => {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') changeSlide(-1);
        if (e.key === 'ArrowRight') changeSlide(1);
    });
</script>
