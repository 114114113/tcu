<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生作品與系所空間 | 慈濟大學 經營管理學系</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-navy: #0f2b48;
            --primary-dark: #0a1c30;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 30px -5px rgba(0,0,0,0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* 導覽列 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 43, 72, 0.96);
            backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .nav-logo {
            height: 42px;
            width: auto;
            border-radius: 6px;
            background: #fff;
            padding: 2px;
        }

        .btn-back-home {
            background: rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back-home:hover {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        /* 頁面標頭 Header */
        .page-header {
            margin-top: 70px;
            background: linear-gradient(135deg, rgba(15,43,72,0.95), rgba(10,28,48,0.9)), url('space.JPG') center/cover no-repeat;
            color: #fff;
            padding: 5rem 5% 4rem;
            text-align: center;
            position: relative;
        }

        .page-title {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
        }

        .page-desc {
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* 內容容器 */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 4rem 5%;
        }

        /* 作品卡片網格 */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .work-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .work-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(217, 119, 6, 0.4);
        }

        .work-media {
            position: relative;
            height: 230px;
            overflow: hidden;
            background: #0f172a;
        }

        .work-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .work-card:hover .work-media img {
            transform: scale(1.06);
        }

        .work-tag {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(15, 43, 72, 0.88);
            color: #fef08a;
            border: 1px solid rgba(217, 119, 6, 0.4);
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }

        .work-body {
            padding: 1.8rem;
        }

        .work-title {
            font-size: 1.25rem;
            color: var(--primary-navy);
            margin-bottom: 0.6rem;
            font-weight: 700;
        }

        .work-author {
            font-size: 0.9rem;
            color: var(--accent-gold);
            margin-bottom: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .work-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* 頁尾 Footer */
        footer {
            background: var(--primary-dark);
            color: rgba(255,255,255,0.6);
            text-align: center;
            padding: 2.5rem;
            font-size: 0.9rem;
            margin-top: 4rem;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        @media (max-width: 768px) {
            .page-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

  

    <!-- 頁面標頭（背景使用了您上傳的 space.JPG） -->
    <header class="page-header">
        <h1 class="page-title">學生作品與學習成果展示</h1>
        <p class="page-desc">展示經管系學生在專題實作、行銷企劃與教學空間中的學習點滴與優秀成果</p>
    </header>

    <!-- 內容展示區 -->
    <main class="container">
        
        <div class="works-grid">

            <!-- 作品卡片 1：讀取您上傳的 work.JPG -->
            <div class="work-card">
                <div class="work-media">
                    <img src="work.JPG" alt="學生實作作品照片" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=600'">
                    <span class="work-tag">學生作品成果</span>
                </div>
                <div class="work-body">
                    <h3 class="work-title">經營管理專題實作成果展示</h3>
                    <div class="work-author"><i class="fa-solid fa-user-graduate"></i> 經管系學生專案團隊</div>
                    <p class="work-desc">結合課程所學之管理理論與實務應用，展現學生在專案規劃、團隊合作與創新思維上的精彩成果。</p>
                </div>
            </div>

            <!-- 空間卡片 2：讀取您上傳的 space.JPG -->
            <div class="work-card">
                <div class="work-media">
                    <img src="space.JPG" alt="系辦與教學場域照片" onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=600'">
                    <span class="work-tag">系所學習空間</span>
                </div>
                <div class="work-body">
                    <h3 class="work-title">系所教學與學習研討空間</h3>
                    <div class="work-author"><i class="fa-solid fa-building-columns"></i> 經營管理學系</div>
                    <p class="work-desc">提供學生舒適且現代化的研討與學習環境，支援個案討論、專題研討與師生交流互動。</p>
                </div>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 慈濟大學經營管理學系 版權所有 | Tzu Chi University Department of Business Management</p>
    </footer>

</body>
</html>
